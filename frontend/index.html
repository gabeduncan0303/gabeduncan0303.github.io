<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Private Gallery</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">Private Gallery</div>
      <div class="actions">
        <span id="whoami" class="muted"></span>
        <button id="btn-logout" class="btn btn-ghost hidden">Logout</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="view-auth" class="card">
      <h1>Sign in</h1>
      <p class="muted">Username + password only. No email. No local storage (you will need to sign in again after refresh).</p>

      <div class="grid2">
        <form id="form-login" class="panel">
          <h2>Login</h2>
          <label>
            Username
            <input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-\.]{3,32}" />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72" />
          </label>
          <button class="btn btn-primary" type="submit">Login</button>
          <div id="login-msg" class="msg"></div>
        </form>

        <form id="form-register" class="panel">
          <h2>Create account</h2>
          <label>
            Username
            <input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-\.]{3,32}" />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" />
          </label>
          <button class="btn btn-primary" type="submit">Register</button>
          <div id="register-msg" class="msg"></div>
        </form>
      </div>
    </section>

    <section id="view-app" class="hidden">
      <section class="card">
        <h1>Your gallery</h1>

        <form id="form-upload" class="upload">
          <input id="file" name="file" type="file" accept="image/*,video/*" required />
          <button class="btn btn-primary" type="submit">Upload</button>
          <div id="upload-msg" class="msg"></div>
        </form>

        <div class="row">
          <button id="btn-refresh" class="btn btn-ghost" type="button">Refresh</button>
          <span id="count" class="muted"></span>
        </div>

        <div id="gallery" class="gallery"></div>
      </section>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
